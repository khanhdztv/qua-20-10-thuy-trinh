<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Quà bí mật 20/10 gửi chị Thùy Trinh</title>
<style>
:root { --pink:#ff6fae; --deep:#b51f67; --cream:#fff5fa; }
* { box-sizing:border-box; }
body {
  margin:0; min-height:100vh; display:flex; align-items:center; justify-content:center;
  padding:22px; font-family:system-ui,-apple-system,"Segoe UI",sans-serif;
  background:radial-gradient(circle at top,#fffafd,#ffd6e8 55%,#f6a8cc);
  color:#7e1748; text-align:center;
}
main { width:min(760px,100%); }
h1 { margin:0 0 8px; font-size:clamp(25px,5vw,40px); }
p { margin:0 0 20px; }
.scene { position:relative; perspective:1000px; margin:18px auto; width:min(430px,90vw); }
.gift {
  position:relative; height:260px; cursor:pointer; border:0; background:transparent;
  width:100%; padding:0; perspective:900px; -webkit-tap-highlight-color:transparent;
}
.boxbase {
  position:absolute; left:5%; right:5%; bottom:10px; height:155px; border-radius:12px 12px 20px 20px;
  background:linear-gradient(135deg,#ffb5d3,#f66ca9 55%,#c82e78);
  box-shadow:0 18px 28px #9e275333, inset 0 3px 7px #fff9;
  border:2px solid #ffe3ef;
}
.boxbase:before { content:""; position:absolute; left:48%; top:0; width:24px; height:100%; background:#ffe0ecaa; }
.ribbon { position:absolute; left:calc(50% - 12px); top:0; height:100%; width:24px; background:#ffe3ef; }
.lid {
  position:absolute; z-index:3; left:1%; right:1%; top:43px; height:76px; border-radius:12px;
  border:3px solid #ffe8f2; background:linear-gradient(135deg,#ff9fc6,#ffcee2 45%,#f66ca9);
  box-shadow:0 8px 14px #9e275344; transform-origin:8% 100%;
  transition:transform 900ms cubic-bezier(.2,.75,.25,1), top 900ms, opacity 500ms;
}
.lid:before { content:""; position:absolute; left:calc(50% - 12px); top:0; bottom:0; width:24px; background:#fff0f7; }
.bow { position:absolute; z-index:4; left:50%; top:18px; transform:translateX(-50%); font-size:57px; filter:drop-shadow(0 3px 2px #a12b5b44); transition:transform 900ms, opacity 400ms; }
.label { position:absolute; z-index:2; left:12%; right:12%; bottom:32px; font-weight:800; font-size:clamp(17px,4vw,24px); color:#fff8fc; text-shadow:0 2px 3px #9e205c; }
.sparkles { position:absolute; inset:0; pointer-events:none; font-size:25px; }
.sparkles span { position:absolute; animation:twinkle 1.6s ease-in-out infinite alternate; }
.sparkles span:nth-child(1) { left:0; top:25px } .sparkles span:nth-child(2) { right:0; top:70px; animation-delay:.4s }
.sparkles span:nth-child(3) { left:8%; bottom:8px; animation-delay:.8s } .sparkles span:nth-child(4) { right:7%; bottom:18px; animation-delay:.2s }
@keyframes twinkle { from { transform:scale(.7) rotate(-10deg); opacity:.55 } to { transform:scale(1.15) rotate(12deg); opacity:1 } }
.reveal { display:none; animation:appear 900ms ease both; }
.reveal img { width:100%; border-radius:18px; box-shadow:0 15px 40px #8c245044; border:5px solid white; }
@keyframes appear { from { opacity:0; transform:translateY(18px) scale(.96) } to { opacity:1; transform:translateY(0) scale(1) } }
.open .lid { transform:translate(-20px,-95px) rotate(-18deg); opacity:.15; }
.open .bow { transform:translate(-50%,-100px) rotate(-18deg); opacity:0; }
.open .gift { cursor:default; }
.open .reveal { display:block; }
.open .scene { display:none; }
button#again { display:none; margin:18px auto 0; border:0; border-radius:999px; padding:12px 20px; background:#b51f67; color:white; font-weight:700; font-size:16px; }
.open button#again { display:inline-block; }
.hint { display:inline-block; background:#fff9; border:1px solid #fff; border-radius:999px; padding:9px 15px; font-size:14px; }
</style>
</head>
